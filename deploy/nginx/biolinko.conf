# /etc/nginx/sites-available/biolinko.conf
# Activer : ln -s /etc/nginx/sites-available/biolinko.conf /etc/nginx/sites-enabled/
# HTTPS : certbot --nginx -d biolinko.link -d www.biolinko.link

server {
    listen 80;
    server_name biolinko.link www.biolinko.link;
    return 301 https://biolinko.link$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.biolinko.link;
    # (certificats ajoutés par certbot)
    return 301 https://biolinko.link$request_uri;
}

server {
    listen 443 ssl http2;
    server_name biolinko.link;
    root /var/www/biolinko/current/public;
    index index.php;
    charset utf-8;

    # (certificats ajoutés par certbot)

    client_max_body_size 20M;   # photos produits (5 Mo max chacune côté Laravel)

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fichiers cachés (.env, .git…) : jamais servis
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compilés : cache long (noms versionnés par Vite)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Aucun autre script PHP exécutable que index.php
    location ~ ^/(?!index\.php).+\.php$ { deny all; }
}
