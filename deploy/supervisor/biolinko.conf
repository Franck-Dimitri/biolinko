# /etc/supervisor/conf.d/biolinko.conf
# Puis : supervisorctl reread && supervisorctl update

# File d'attente (e-mails, notifications)
[program:biolinko-queue]
command=php /var/www/biolinko/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/biolinko/shared/storage/logs/queue.log

# Rendu serveur des pages (SSR Inertia) : SEO et affichage rapide
[program:biolinko-ssr]
command=php /var/www/biolinko/current/artisan inertia:start-ssr
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/biolinko/shared/storage/logs/ssr.log
